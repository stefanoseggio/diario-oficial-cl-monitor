name: Feature Request
description: Propose a new input field, output field, or section/coverage addition
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing new section coverage or a historical-date capability? Check this Actor's README
        → Known limitations first — some gaps (like the lack of a historical-date input) are
        documented as deliberate, not oversights, so read why before filing.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the real use case this would unblock, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What input field, output field, or behavior would you like to see added?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New input filter
        - New output field
        - New section coverage
        - Delta-engine / classification logic change
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Can this already be achieved with existing inputs (e.g. sections, eventTypes)? If so, why isn't that sufficient?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this isn't already possible with an existing input field (see README → Input & Output Schema)
          required: true
        - label: I checked the README's Known limitations section for related, already-documented constraints
          required: false
